name: Health
on:
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  health:
    uses: dart-lang/ecosystem/.github/workflows/health.yaml@78abf72b3cfcc7c6c822032d8915153019fe79b7 # main
    with:
      checks: "changelog,do-not-submit,publish"
      fail_on: "changelog,do-not-submit,publish"
      warn_on: "license,coverage,breaking,leaking,unused-dependencies"
    permissions:
      pull-requests: write
