name: Health
on:
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  health:
    uses: dart-lang/ecosystem/.github/workflows/health.yaml@27c2fc841818cce349e1f424af51cca9ea381f47 # main
    with:
      checks: "changelog,do-not-submit,publish"
      fail_on: "changelog,do-not-submit,publish"
      warn_on: "license,coverage,breaking,leaking,unused-dependencies"
    permissions:
      pull-requests: write
