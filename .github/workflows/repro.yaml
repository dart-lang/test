name: Windows Socket Repro

on:
  push:
    branches: [ unawaited-socket-cancel ]
  pull_request:
    branches: [ unawaited-socket-cancel ]
  workflow_dispatch:

jobs:
  repro:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: dev
      - name: Run repro
        run: dart run tool/repro/main.dart
