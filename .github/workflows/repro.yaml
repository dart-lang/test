name: Socket Cancellation Repro

on:
  push:
    branches: [unawaited-socket-cancel]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  repro:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: dev
      - name: Run repro
        run: dart tool/repro/main.dart
